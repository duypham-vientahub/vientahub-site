name: Market Pulse simulation

on:
  schedule:
    - cron: "40 23 * * *"   # 06:40 giờ Việt Nam mỗi ngày
  push:
    branches: [main]
    paths: ["thi-truong/sim/config.json", "thi-truong/sim/run_sim.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-sim
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: thi-truong/sim/requirements.txt
      - run: pip install -r thi-truong/sim/requirements.txt
      - name: Run simulation
        run: python thi-truong/sim/run_sim.py
      - name: Commit result
        run: |
          git config user.name "market-sim-bot"
          git config user.email "market-sim-bot@users.noreply.github.com"
          git add thi-truong/sim/sim.json thi-truong/sim/market.json
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "Market Pulse simulation $(TZ=Asia/Ho_Chi_Minh date +%d/%m/%Y)"
          git pull --rebase origin main
          git push origin HEAD:main
